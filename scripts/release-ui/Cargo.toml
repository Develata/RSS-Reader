[package]
name = "release-ui"
version = "0.1.0"
edition = "2024"
publish = false

# Acceptance tooling is intentionally independent of the product workspace.
[workspace]

[dependencies]
clap = { version = "4.6.2", features = ["derive"] }
process-wrap = { version = "10.0.1", default-features = false, features = ["std", "process-group", "job-object", "creation-flags"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
# Already locked transitively; kill(..., 0) probes group existence, not just the leader.
libc = "0.2"
signal-hook = "0.3.18"

[target.'cfg(windows)'.dependencies]
ctrlc = "3.5.2"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Threading"] }

[[bin]]
name = "release-ui"
path = "main.rs"
