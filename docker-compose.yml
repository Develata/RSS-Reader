services:
  rss-reader:
    image: ${RSS_READER_IMAGE:-ghcr.io/develata/rss-reader:latest}
    environment:
      RSS_READER_WEB_USERNAME: ${RSS_READER_WEB_USERNAME:?RSS_READER_WEB_USERNAME is required}
      # The address users open, scheme://host[:port]; it must match the published port.
      RSS_READER_WEB_PUBLIC_ORIGIN: ${RSS_READER_WEB_PUBLIC_ORIGIN:?Set the exact public origin, for example http://localhost:8039}
      # Initial credential, read only when /data/auth.sqlite3 has none (then `rssr-web passwd`).
      RSS_READER_WEB_PASSWORD_HASH: ${RSS_READER_WEB_PASSWORD_HASH:-}
      RSS_READER_WEB_PASSWORD: ${RSS_READER_WEB_PASSWORD:-}
      RSS_READER_WEB_AUTH_STATE_FILE: ${RSS_READER_WEB_AUTH_STATE_FILE:-/app/auth/auth.json}
      RSS_READER_WEB_ENV: ${RSS_READER_WEB_ENV:-development}
      RSS_READER_WEB_TRUST_PROXY_HEADERS: ${RSS_READER_WEB_TRUST_PROXY_HEADERS:-false}
    ports:
      - "${RSS_READER_PORT:-8039}:8080"
    volumes:
      - rss-reader-data:/data
      # v0.1 credential volume: keep it mounted until auth.sqlite3 exists in rss-reader-data.
      - rss-reader-auth:/app/auth
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  rss-reader-data:
  rss-reader-auth:
