[package]
name = "rssr-web"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
build = "build.rs"

[dependencies]
anyhow.workspace = true
argon2.workspace = true
axum.workspace = true
base64.workspace = true
clap.workspace = true
hmac.workspace = true
rand_core.workspace = true
reqwest.workspace = true
rssr-api = { path = "../rssr-api" }
rssr-application = { path = "../rssr-application" }
rssr-domain = { path = "../rssr-domain" }
rssr-infra = { path = "../rssr-infra" }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["fs", "net", "rt-multi-thread", "signal", "sync"] }
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
urlencoding.workspace = true

[dev-dependencies]
# Paused time for the background jobs' tests (retention, poll waits).
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(unix)'.dependencies]
# The authentication database's owner check (auth::store).
libc = "0.2"
