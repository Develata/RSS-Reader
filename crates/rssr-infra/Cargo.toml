[package]
name = "rssr-infra"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[package.metadata.rssr]
# Shared SQL cases run on native and in a real browser; executor cases are browser-only.
wasm-contracts = [
    "test_library_contracts",
    "test_library_entry_state_and_search",
    "test_library_queries",
    "test_library_refresh_contract_harness",
    "test_library_subscription_contract_harness",
    "test_library_config_exchange_contract_harness",
    "test_library_settings_repository",
    "test_library_persistence_atomicity",
    "test_library_application_refresh_store_adapter",
    "test_library_unicode_title_search",
    "test_library_refresh_tickets",
    "wasm_memory_store",
    "test_opml_interop",
]

[features]
# Pages only: shared repositories over a private in-memory SQLite connection.
memory-store = ["dep:rusqlite", "dep:gloo-timers"]
# `HttpBackend`, the `Backend` over the server's `/api/v1`: the formal Web page uses it, and the
# server's tests run it natively against the real router.
http-backend = ["dep:gloo-timers"]

[dependencies]
ammonia.workspace = true
html5ever = "0.39"
encoding_rs = "0.8"
futures-util = "0.3"
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
feed-rs.workspace = true
percent-encoding.workspace = true
quick-xml.workspace = true
regex.workspace = true
rssr-api = { path = "../rssr-api" }
rssr-application = { path = "../rssr-application" }
rssr-domain = { path = "../rssr-domain" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The outbound policy resolves host names itself (crate::outbound).
tokio = { workspace = true, features = ["net"] }
reqwest = { version = "0.12", default-features = false, features = ["charset", "gzip", "http2", "json", "stream", "rustls-tls"] }
# Library storage (crate::store). The bundled SQLite must be at least 3.51.3: earlier versions
# have the WAL-reset bug (https://sqlite.org/wal.html#walreset); guarded by
# `test_library_store::bundled_sqlite_has_the_wal_reset_fix`.
rusqlite = { workspace = true, features = ["backup", "cache", "functions", "hooks"] }

[target.'cfg(unix)'.dependencies]
# The outbound policy file's owner check (crate::outbound).
libc = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
rusqlite = { workspace = true, features = ["ffi-sqlite-wasm-rs", "cache", "functions", "hooks"], optional = true }
# feed-rs creates UUIDs for entries without an id; enable its browser randomness source.
uuid = { version = "1", features = ["js"] }
# The waits between polls of a background job (`http-backend`).
gloo-timers = { version = "0.3", features = ["futures"], optional = true }
js-sys = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["charset", "gzip", "http2", "json", "stream"] }
wasm-bindgen-futures = "0.4"

[dev-dependencies]
rssr-application = { path = "../rssr-application" }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# `io-util`: the scripted server of `http_backend`'s tests.
tokio = { workspace = true, features = ["rt-multi-thread", "io-util"] }
