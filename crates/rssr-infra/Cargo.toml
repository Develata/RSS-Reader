[package]
name = "rssr-infra"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
# The library kept in the browser (localStorage) with the use cases running in the page: only the
# Pages demo enables it (rssr-app's `pages-demo`). The formal Web build talks to the server instead
# and must not contain it (phase C, C4; `rssr-api/tests/dependency_graph.rs`).
browser-store = []
# `HttpBackend`, the `Backend` over the server's `/api/v1`: the formal Web page uses it, and the
# server's tests run it natively against the real router.
http-backend = ["dep:gloo-timers"]

[dependencies]
ammonia.workspace = true
html5ever = "0.39"
encoding_rs = "0.8"
futures-util = "0.3"
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
feed-rs.workspace = true
percent-encoding.workspace = true
quick-xml.workspace = true
regex.workspace = true
rssr-api = { path = "../rssr-api" }
rssr-application = { path = "../rssr-application" }
rssr-domain = { path = "../rssr-domain" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The outbound policy resolves host names itself (crate::outbound).
tokio = { workspace = true, features = ["net"] }
reqwest = { version = "0.12", default-features = false, features = ["charset", "gzip", "http2", "json", "stream", "rustls-tls"] }
# Library storage (crate::store). The bundled SQLite must be at least 3.51.3: earlier versions
# have the WAL-reset bug (https://sqlite.org/wal.html#walreset); guarded by
# `test_library_store::bundled_sqlite_has_the_wal_reset_fix`.
rusqlite = { workspace = true, features = ["backup", "cache", "functions", "hooks"] }

[target.'cfg(unix)'.dependencies]
# The outbound policy file's owner check (crate::outbound).
libc = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The waits between polls of a background job (`http-backend`).
gloo-timers = { version = "0.3", features = ["futures"], optional = true }
js-sys = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["charset", "gzip", "http2", "json", "stream"] }
uuid = { version = "1", features = ["js", "v4"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Location", "Storage", "Window"] }

[dev-dependencies]
rssr-application = { path = "../rssr-application" }

# The browser storage contract harnesses (run in a browser by scripts/run_wasm_contract_harness.sh).
[[test]]
name = "wasm_config_exchange_contract_harness"
required-features = ["browser-store"]

[[test]]
name = "wasm_refresh_contract_harness"
required-features = ["browser-store"]

[[test]]
name = "wasm_subscription_contract_harness"
required-features = ["browser-store"]

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }
