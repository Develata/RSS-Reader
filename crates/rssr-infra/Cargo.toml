[package]
name = "rssr-infra"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
ammonia.workspace = true
html5ever = "0.39"
encoding_rs = "0.8"
futures-util = "0.3"
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
feed-rs.workspace = true
percent-encoding.workspace = true
quick-xml.workspace = true
regex.workspace = true
rssr-application = { path = "../rssr-application" }
rssr-domain = { path = "../rssr-domain" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["charset", "gzip", "http2", "json", "stream", "rustls-tls"] }
sqlx = { version = "0.9", default-features = false, features = ["macros", "migrate", "runtime-tokio", "sqlite", "time"] }
# sqlx 0.9 accepts libsqlite3-sys >=0.30.1,<0.38 and builds the SQLite it bundles (via its
# `sqlite` feature). Pin the bundle that carries SQLite 3.51.3: earlier versions have the
# WAL-reset bug (https://sqlite.org/wal.html#walreset). Guarded by
# `db::tests::bundled_sqlite_has_the_wal_reset_fix`.
libsqlite3-sys = { version = "0.37", default-features = false }
# v0.2 library storage (crate::store). Shares libsqlite3-sys 0.37 with sqlx until sqlx is removed.
rusqlite = { version = "0.39", default-features = false, features = ["bundled", "cache", "functions", "hooks"] }
tokio = { workspace = true, features = ["rt"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["charset", "gzip", "http2", "json", "stream"] }
uuid = { version = "1", features = ["js", "v4"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Location", "Storage", "Window"] }

[dev-dependencies]
rssr-application = { path = "../rssr-application" }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }
