[workspace]
members = [
    "crates/rssr-app",
    "crates/rssr-cli",
    "crates/rssr-web",
    "crates/rssr-application",
    "crates/rssr-domain",
    "crates/rssr-infra",
]
# 本地打补丁的依赖副本，不是工作区成员（不跑它的 lint 与测试）。
exclude = ["vendor/url"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Develata"]
repository = "https://github.com/Develata/RSS-Reader"

[workspace.dependencies]
ammonia = "4"
anyhow = "1"
argon2 = "0.5"
async-trait = "0.1"
axum = { version = "0.8", features = ["form", "http1", "tokio"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
dioxus = { version = "0.7.9", features = ["router"] }
dioxus-router = "0.7.9"
feed-rs = "2"
getrandom = { version = "0.2", features = ["js"] }
hmac = "0.12"
percent-encoding = "2"
quick-xml = "0.37"
rand_core = { version = "0.6", features = ["getrandom"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["charset", "gzip", "http2", "json", "rustls-tls"] }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["macros", "migrate", "runtime-tokio-rustls", "sqlite", "time"] }
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["macros", "sync", "time"] }
time = { version = "0.3", features = ["formatting", "macros", "parsing", "serde", "serde-human-readable"] }
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = { version = "2", features = ["serde"] }
urlencoding = "2"
webbrowser = "1"

# `url` 2.5.8 处理 `..` 段时会反扫整个 authority，长用户名加大量 `../` 的地址解析是平方级。
# 本地副本只改了 `Parser::last_slash_can_be_removed` 一处，说明与移除条件见 vendor/url/PATCH.md。
[patch.crates-io]
url = { path = "vendor/url" }
