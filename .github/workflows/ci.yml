name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      packages: ${{ steps.matrix.outputs.packages }}
      harnesses: ${{ steps.matrix.outputs.harnesses }}
      wasm-bindgen-version: ${{ steps.matrix.outputs.wasm-bindgen-version }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Read workspace members from Cargo
        id: matrix
        run: |
          cargo metadata --locked --no-deps --format-version 1 > metadata.json
          python3 - <<'PY'
          import json, os, tomllib
          with open('metadata.json') as source:
              metadata = json.load(source)
          members = set(metadata['workspace_members'])
          packages = sorted(p['name'] for p in metadata['packages'] if p['id'] in members)
          infra = next(p for p in metadata['packages'] if p['name'] == 'rssr-infra')
          harnesses = sorted(t['name'] for t in infra['targets']
                            if 'test' in t['kind'] and t['name'].startswith('wasm_')
                            and t['name'].endswith('_contract_harness'))
          with open('Cargo.lock', 'rb') as source:
              versions = {p['version'] for p in tomllib.load(source)['package']
                          if p['name'] == 'wasm-bindgen'}
          assert packages, 'workspace matrix must not be empty'
          assert harnesses, 'wasm contract matrix must not be empty'
          assert len(versions) == 1, 'expected one locked wasm-bindgen version'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('packages=' + json.dumps(packages) + '\n')
              output.write('harnesses=' + json.dumps(harnesses) + '\n')
              output.write('wasm-bindgen-version=' + versions.pop() + '\n')
          PY

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Lint GitHub workflows with verified actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          tool_dir="$RUNNER_TEMP/actionlint"
          mkdir -p "$tool_dir"
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          release="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          curl -fsSL --retry 3 --connect-timeout 15 --max-time 120 "$release/$archive" -o "$tool_dir/$archive"
          curl -fsSL --retry 3 --connect-timeout 15 --max-time 120 "$release/actionlint_${ACTIONLINT_VERSION}_checksums.txt" -o "$tool_dir/checksums.txt"
          (cd "$tool_dir" && grep -F "  $archive" checksums.txt | sha256sum --check --strict)
          tar -xzf "$tool_dir/$archive" -C "$tool_dir" actionlint
          command -v shellcheck
          "$tool_dir/actionlint" -color
      - name: Check standalone Rust acceptance runner
        run: |
          rustfmt --edition 2024 --check scripts/wasm_contract_runner.rs
          mkdir -p target/test-tools
          clippy-driver --edition 2024 --test scripts/wasm_contract_runner.rs -o target/test-tools/wasm-runner-tests -D warnings
          target/test-tools/wasm-runner-tests
      - name: Check Linux Debian metadata adapter
        run: bash scripts/test_prepare_linux_deb.sh

  native-module:
    needs: workspace
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        package: ${{ fromJSON(needs.workspace.outputs.packages) }}
    env:
      PACKAGE: ${{ matrix.package }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cleanup runner
        uses: ./.github/actions/cleanup-github-runner

      - name: Install system dependencies
        if: matrix.package == 'rssr-app'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libxdo-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: native-${{ matrix.package }}

      - name: Module Clippy
        run: cargo clippy --locked -p "$PACKAGE" --all-targets -- -D warnings

      - name: Module tests including doc tests
        run: cargo test --locked -p "$PACKAGE"

      - name: CLI smoke
        if: matrix.package == 'rssr-cli'
        run: cargo run --locked -p rssr-cli -- --help

  web-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DIOXUS_CLI_VERSION: 0.7.9
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cleanup runner
        uses: ./.github/actions/cleanup-github-runner

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: web-build

      - name: Setup Dioxus CLI
        uses: ./.github/actions/setup-dioxus-cli
        with:
          version: ${{ env.DIOXUS_CLI_VERSION }}

      - name: Wasm target check
        run: cargo check --locked -p rssr-app --target wasm32-unknown-unknown

      - name: Web bundle smoke
        run: |
          dx bundle --platform web --package rssr-app --release --locked --debug-symbols false --out-dir target/web-dist
          test -s target/dx/rssr-app/release/web/public/index.html

      - name: Share the exact Web build with UI jobs
        uses: actions/upload-artifact@v7
        with:
          name: ci-web-public
          path: target/dx/rssr-app/release/web/public/
          if-no-files-found: error
          retention-days: 3

  web-ui:
    needs: web-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        preset: [default, atlas-sidebar, newsprint, amethyst-glass, midnight-ledger]
    env:
      PRESET: ${{ matrix.preset }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: ci-web-public
          path: target/dx/rssr-app/release/web/public/
      - name: Setup Chrome for Testing
        uses: ./.github/actions/setup-browser-tests
        with:
          with-driver: 'false'
      - name: Real UI assertions at mobile and desktop viewports
        run: |
          args=(--release --skip-build --chrome-bin "$HOME/.local/bin/google-chrome" --log-dir "target/ci-ui/$PRESET")
          if [[ "$PRESET" != default ]]; then args+=(--preset "$PRESET"); fi
          bash scripts/run_static_web_small_viewport_smoke.sh "${args[@]}"
      - name: Preserve UI evidence even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-ui-${{ matrix.preset }}
          path: |
            target/ci-ui/${{ matrix.preset }}/*.json
            target/ci-ui/${{ matrix.preset }}/*.md
            target/ci-ui/${{ matrix.preset }}/*.log
            target/ci-ui/${{ matrix.preset }}/*.png
            target/ci-ui/${{ matrix.preset }}/*.html
          retention-days: 7

  wasm-contract-build:
    needs: workspace
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cleanup runner
        uses: ./.github/actions/cleanup-github-runner

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: wasm-contract-build

      - name: Compile all contract harnesses once using Cargo's artifact paths
        env:
          HARNESSES: ${{ join(fromJSON(needs.workspace.outputs.harnesses), ' ') }}
        run: |
          read -r -a harnesses <<< "$HARNESSES"
          bash scripts/run_wasm_contract_harness.sh --prepare "$RUNNER_TEMP/ci-wasm-contracts" "${harnesses[@]}"

      - name: Share the exact contract artifacts with browser jobs
        uses: actions/upload-artifact@v7
        with:
          name: ci-wasm-contracts
          path: ${{ runner.temp }}/ci-wasm-contracts/
          if-no-files-found: error
          retention-days: 3

      # Warm the shared native tool cache before the parallel jobs start.
      - name: Prepare pinned wasm-bindgen test runner
        uses: ./.github/actions/setup-wasm-bindgen
        with:
          version: ${{ needs.workspace.outputs.wasm-bindgen-version }}

  wasm-browser-contract:
    needs: [workspace, wasm-contract-build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        harness: ${{ fromJSON(needs.workspace.outputs.harnesses) }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v8
        with:
          name: ci-wasm-contracts
          path: ${{ runner.temp }}/ci-wasm-contracts/
      - uses: ./.github/actions/setup-wasm-bindgen
        with:
          version: ${{ needs.workspace.outputs.wasm-bindgen-version }}

      - name: Setup Chrome for Testing
        uses: ./.github/actions/setup-browser-tests

      - name: Run wasm browser contract harness
        env:
          HARNESS: ${{ matrix.harness }}
        run: bash scripts/run_wasm_contract_harness.sh --prebuilt "$RUNNER_TEMP/ci-wasm-contracts" "$HARNESS"

  android-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      ANDROID_NDK_VERSION: 27.3.13750724
      ANDROID_API_LEVEL: 34
      DIOXUS_CLI_VERSION: 0.7.9
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cleanup runner
        uses: ./.github/actions/cleanup-github-runner

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          # sdkmanager closes stdin after the final prompt; avoid treating yes's
          # expected SIGPIPE as a license failure under GitHub's pipefail shell.
          sdkmanager --licenses < <(yes)
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Configure Android toolchain
        run: |
          ANDROID_NDK_DIR="$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION"
          test -d "$ANDROID_NDK_DIR"
          ANDROID_LLVM_BIN="$ANDROID_NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "$ANDROID_LLVM_BIN" >> "$GITHUB_PATH"
          {
            echo "ANDROID_HOME=$ANDROID_SDK_ROOT"
            echo "ANDROID_NDK_HOME=$ANDROID_NDK_DIR"
            echo "ANDROID_NDK_ROOT=$ANDROID_NDK_DIR"
            echo "CC_aarch64_linux_android=$ANDROID_LLVM_BIN/aarch64-linux-android${ANDROID_API_LEVEL}-clang"
            echo "AR_aarch64_linux_android=$ANDROID_LLVM_BIN/llvm-ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$ANDROID_LLVM_BIN/aarch64-linux-android${ANDROID_API_LEVEL}-clang"
          } >> "$GITHUB_ENV"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: android-build

      - name: Setup Dioxus CLI
        uses: ./.github/actions/setup-dioxus-cli
        with:
          version: ${{ env.DIOXUS_CLI_VERSION }}

      - name: Android target smoke check
        run: cargo check --locked -p rssr-app --target aarch64-linux-android

      - name: Android bundle smoke
        run: |
          rm -rf target/dx/rssr-app/release/android
          dx bundle --platform android --package rssr-app --target aarch64-linux-android --release --locked --debug-symbols false
          # 带上假 tag：让 --release-tag → parse_release_tag → patch_gradle_version 这条链
          # 进日常 CI。否则它只在真正打 tag 时才第一次执行，正是「只在发布路径上跑」的老毛病。
          python3 scripts/prepare_android_bundle.py \
            target/dx/rssr-app/release/android/app/app/src/main \
            --release-tag v9.87.65
          (
            cd target/dx/rssr-app/release/android/app
            ./gradlew assembleDebug --no-daemon --console=plain
          )
          APK_PATH="$(find target/dx/rssr-app/release/android -path '*outputs/apk/debug/*.apk' | head -n1)"
          test -n "$APK_PATH"
          # dx 0.7.9 起原生库默认名为 libmain.so（NativeActivity 约定，可经 Dioxus.toml [android] lib_name 覆写）
          unzip -l "$APK_PATH" > apk-files-ci.txt
          grep -F 'lib/arm64-v8a/libmain.so' apk-files-ci.txt
          if grep -F 'lib/x86_64/libmain.so' apk-files-ci.txt; then
            echo '::error::ARM64 smoke APK unexpectedly contains an x86_64 native library'
            exit 1
          fi
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt" dump badging "$APK_PATH" > badging-ci.txt
          grep -F "application-label:'RSS-Reader'" badging-ci.txt
          grep -E 'application-icon-.*rssr_launcher' badging-ci.txt
          # v9.87.65 → 9 * 10000 + 87 * 100 + 65。断言的是 AGP 最终采纳的值，
          # 不只是「字符串写进了 Gradle 文件」。
          grep -F "versionCode='98765'" badging-ci.txt
          grep -F "versionName='9.87.65'" badging-ci.txt

  # Keep the former required-check name stable, now aggregating every module.
  lint-and-test:
    if: always()
    needs: [workspace, format, test-tools, native-module, web-smoke, web-ui, wasm-contract-build, wasm-browser-contract, android-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all acceptance modules to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = json.loads(os.environ['RESULTS'])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('| Module | Result |\n| --- | --- |\n')
              for name, result in results.items():
                  summary.write(f"| {name} | {result['result']} |\n")
          sys.exit(0 if results and all(r['result'] == 'success' for r in results.values()) else 1)
          PY
