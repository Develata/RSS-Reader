name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag name to publish, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
  # Android 的 versionCode / versionName 只能来自这里：workspace Cargo.toml 长期停在 0.1.0，
  # 而 dx 脚手架固定生成 versionCode = 1。
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  DIOXUS_CLI_VERSION: 0.7.9

concurrency:
  group: release-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      ANDROID_NDK_VERSION: 27.3.13750724
      ANDROID_API_LEVEL: 34
      ANDROID_RELEASE_READY: >-
        ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' &&
            secrets.ANDROID_KEYSTORE_PASSWORD != '' &&
            secrets.ANDROID_KEY_ALIAS != '' &&
            secrets.ANDROID_KEY_PASSWORD != '' }}
    steps:
      # 打 tag 发布时签名密钥是硬要求。少了它整段签名逻辑连同 debug 密钥守卫都会被
      # `if: env.ANDROID_RELEASE_READY == 'true'` 跳过，然后安安静静发一个 debug APK——
      # 用户侧的表现就是这次事故本身（覆盖安装「校验失败」），而 CI 全绿。
      # workflow_dispatch 仍允许降级，方便不碰密钥地验证其它平台。
      - name: Require Android signing for tag releases
        if: github.event_name == 'push' && env.ANDROID_RELEASE_READY != 'true'
        run: |
          echo "::error::tag 发布必须配置 ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD"
          exit 1

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Cleanup runner
        uses: ./.github/actions/cleanup-github-runner

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Configure Android toolchain
        run: |
          ANDROID_NDK_DIR="$(find "$ANDROID_SDK_ROOT/ndk" -mindepth 1 -maxdepth 1 -type d | sort | tail -n1)"
          test -n "$ANDROID_NDK_DIR"
          ANDROID_LLVM_BIN="$ANDROID_NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_DIR" >> "$GITHUB_ENV"
          echo "$ANDROID_LLVM_BIN" >> "$GITHUB_PATH"
          echo "CC_aarch64_linux_android=$ANDROID_LLVM_BIN/aarch64-linux-android${ANDROID_API_LEVEL}-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$ANDROID_LLVM_BIN/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$ANDROID_LLVM_BIN/aarch64-linux-android${ANDROID_API_LEVEL}-clang" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Setup Dioxus CLI
        uses: ./.github/actions/setup-dioxus-cli
        with:
          version: ${{ env.DIOXUS_CLI_VERSION }}

      - name: Prefetch Gradle distribution
        run: |
          mkdir -p "$HOME/.gradle/wrapper/dists/gradle-9.1.0-bin/9agqghryom9wkf8r80qlhnts3"
          curl -L --fail --retry 3 --retry-delay 2 \
            -o "$HOME/.gradle/wrapper/dists/gradle-9.1.0-bin/9agqghryom9wkf8r80qlhnts3/gradle-9.1.0-bin.zip" \
            https://services.gradle.org/distributions/gradle-9.1.0-bin.zip

      - name: Build Android debug APK
        run: |
          rm -rf target/dx/rssr-app/release/android
          dx bundle --platform android --package rssr-app --target aarch64-linux-android --release --debug-symbols false
          python3 scripts/prepare_android_bundle.py \
            target/dx/rssr-app/release/android/app/app/src/main \
            --release-tag "$RELEASE_TAG"

          # versionCode 复用脚本里那份实现，不在 shell 里重写一遍公式——
          # 两处各写一份迟早会漂移，而漂移的表现是断言恒真。
          ANDROID_VERSION_CODE="$(python3 -c 'import sys; sys.path.insert(0, "scripts"); from prepare_android_bundle import parse_release_tag; print(parse_release_tag(sys.argv[1])[0])' "$RELEASE_TAG")"
          echo "ANDROID_VERSION_CODE=$ANDROID_VERSION_CODE" >> "$GITHUB_ENV"

          cd target/dx/rssr-app/release/android/app
          ./gradlew assembleDebug --no-daemon --console=plain
          cd -

      - name: Validate Android debug APK branding
        run: |
          AAPT="$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt"
          # 与 Archive 步骤同一条确定路径，不用 `find | head -n1`（同一批输出目录里
          # 可能不止一个候选产物，挑中哪个取决于目录顺序）。
          APK_PATH=target/dx/rssr-app/release/android/app/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK_PATH"
          "$AAPT" dump badging "$APK_PATH" > badging-debug.txt

          grep -F "application-label:'RSS-Reader'" badging-debug.txt
          grep -E 'application-icon-.*rssr_launcher' badging-debug.txt
          grep -F "targetSdkVersion:'34'" badging-debug.txt

          # 版本号在 debug 包上就断言一次：它和 release 包出自同一份被 patch 过的 Gradle 文件，
          # 这里失败可以省掉后面那次昂贵的 release 构建。versionCode 必须一起断言——
          # 「versionCode 永远是 1、用户升不了级」正是这次要修的问题，只断言 versionName
          # 等于没验到点子上。
          grep -F "versionName='${RELEASE_TAG#v}'" badging-debug.txt
          grep -F "versionCode='${ANDROID_VERSION_CODE}'" badging-debug.txt

      - name: Prepare Android release signing
        if: env.ANDROID_RELEASE_READY == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          cd target/dx/rssr-app/release/android/app
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > release-keystore.jks
          cat <<'EOF' >> app/build.gradle.kts

          android {
              signingConfigs {
                  create("release") {
                      storeFile = rootProject.file("release-keystore.jks")
                      storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias = System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword = System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
          }
          EOF

      - name: Build Android release APK and AAB
        if: env.ANDROID_RELEASE_READY == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd target/dx/rssr-app/release/android/app
          ./gradlew assembleRelease bundleRelease --no-daemon --console=plain

      - name: Validate Android release branding
        if: env.ANDROID_RELEASE_READY == 'true'
        run: |
          AAPT="$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt"
          AAPT2="$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt2"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner"
          OUT_DIR=target/dx/rssr-app/release/android/app/app/build/outputs
          RELEASE_APK_PATH="$OUT_DIR/apk/release/app-release.apk"
          RELEASE_AAB_PATH="$OUT_DIR/bundle/release/app-release.aab"

          # 用确定路径，不用 `find | head -n1`。`dx bundle` 自己也会往
          # bundle/release/ 里放一个 RssrApp-*.aab，而它产于 prepare_android_bundle.py
          # 打图标之前——`find` 在两个 aab 之间挑中哪个取决于目录顺序，挑中 dx 那个就
          # 必然查不到 rssr_launcher。这两条路径与下面 Archive 步骤实际拷贝的完全一致。
          if [ ! -f "$RELEASE_APK_PATH" ] || [ ! -f "$RELEASE_AAB_PATH" ]; then
            echo "::error::找不到预期的 release 产物"
            ls -l "$OUT_DIR/apk/release" "$OUT_DIR/bundle/release" || true
            exit 1
          fi

          # 先一次性落盘再断言。`工具 | grep` 这种写法在工具缺失或失败时会退化成
          # 「grep 读到空输入」：正向断言（grep 到才算过）会响亮失败，没问题；但**反向**
          # 断言（grep 到就报错）会静默通过。下面的 debug 签名守卫正是反向断言，
          # 必须先让工具自己的退出码炸出来，否则 apksigner 一旦缺失，守卫形同虚设。
          "$AAPT" dump badging "$RELEASE_APK_PATH" > badging.txt
          "$AAPT2" dump resources "$RELEASE_APK_PATH" > resources.txt
          "$APKSIGNER" verify --print-certs "$RELEASE_APK_PATH" > certs.txt

          echo "--- 产物 ---"; ls -l "$RELEASE_APK_PATH" "$RELEASE_AAB_PATH"
          echo "--- badging ---"; grep -E "^(package|targetSdkVersion|application):" badging.txt || true
          echo "--- mipmap 资源 ---"; grep -E 'mipmap/' resources.txt || true
          echo "--- 签名证书 ---"; grep -E 'certificate (DN|SHA-256)' certs.txt || true

          # 下面每条断言都先报出自己在查什么。`grep -q` / `test` 成功时是静默的，
          # 一串静默断言里失败任何一条，日志上都只剩一个 exit 1，根本定位不到是哪条。
          echo "[检查] 应用名 / targetSdk / 版本号"
          grep -F "application-label:'RSS-Reader'" badging.txt > /dev/null
          grep -F "targetSdkVersion:'34'" badging.txt > /dev/null
          grep -F "versionName='${RELEASE_TAG#v}'" badging.txt > /dev/null
          grep -F "versionCode='${ANDROID_VERSION_CODE}'" badging.txt > /dev/null

          # 图标要端到端地断言：既要资源名对，又要它确实是 manifest 解析出来的那个图标。
          # 只查「资源表里存在 rssr_launcher」是不够的——图标属性丢失时，脚手架默认的
          # ic_launcher 会顶上，而我们拷进去的 png 仍在资源表里，两个弱断言都能过。
          # release 会跑 optimizeReleaseResources 把 res/mipmap-*/rssr_launcher.png 压成
          # res/xY.png，所以只能先从 badging 拿解析后的路径，再回资源表查它属于哪个资源名。
          ICON_PATH="$(sed -n "s/^application: .*icon='\([^']*\)'.*/\1/p" badging.txt | head -n1)"
          echo "[检查] 应用图标解析路径 = ${ICON_PATH:-<空>}"
          test -n "$ICON_PATH"
          ICON_RES="$(awk -v p="$ICON_PATH" '/^ *resource /{cur=$3} index($0,p){print cur}' resources.txt | sort -u)"
          echo "[检查] 该路径对应资源名 = ${ICON_RES:-<空>}"
          test "$ICON_RES" = "mipmap/rssr_launcher"

          # AAB 里资源名以明文存在 protobuf 资源表中，不受路径压缩影响。
          echo "[检查] AAB 资源表"
          unzip -l "$RELEASE_AAB_PATH" | grep -q 'base/resources.pb' \
            || { echo "::error::AAB 里没有 base/resources.pb"; unzip -l "$RELEASE_AAB_PATH" | head -n 30; exit 1; }
          unzip -p "$RELEASE_AAB_PATH" base/resources.pb | grep -qa 'rssr_launcher' \
            || { echo "::error::AAB 资源表里没有 rssr_launcher"; exit 1; }

          # 兜住这次事故的源头：签名一旦悄悄退回 debug 密钥，装机端就会再次「校验失败」。
          # 先正向断言「确实存在签名者」，再反向断言「不是 debug 证书」。
          echo "[检查] 签名证书"
          grep -q 'Signer #1 certificate DN:' certs.txt
          if grep -q 'CN=Android Debug' certs.txt; then
            echo "::error::release APK 仍由 debug 密钥签名，签名配置没有生效"
            exit 1
          fi
          echo "[通过] release 产物校验全部通过"

      - name: Archive Android artifacts
        run: |
          mkdir -p release-assets
          if [ "$ANDROID_RELEASE_READY" = "true" ]; then
            # 配了签名密钥就只发正式包。debug 包用的是 CI 每次现生成的临时密钥，签名和正式包对不上，
            # 两个 APK 并排挂在 Release 页上，用户装错一个就会再次撞上「签名不一致装不上」。
            cp target/dx/rssr-app/release/android/app/app/build/outputs/apk/release/app-release.apk \
              release-assets/RSS-Reader-android-arm64-v8a-release.apk
            cp target/dx/rssr-app/release/android/app/app/build/outputs/bundle/release/app-release.aab \
              release-assets/RSS-Reader-android-arm64-v8a-release.aab
          else
            cp target/dx/rssr-app/release/android/app/app/build/outputs/apk/debug/app-debug.apk \
               release-assets/RSS-Reader-android-arm64-v8a-debug.apk
          fi

      - name: Smoke-check archived Android artifacts
        run: |
          AAPT="$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt"
          if [ "$ANDROID_RELEASE_READY" = "true" ]; then
            test -f release-assets/RSS-Reader-android-arm64-v8a-release.apk
            test -f release-assets/RSS-Reader-android-arm64-v8a-release.aab
            test ! -f release-assets/RSS-Reader-android-arm64-v8a-debug.apk
            "$AAPT" dump badging release-assets/RSS-Reader-android-arm64-v8a-release.apk > badging-archived.txt
            grep -F "application-label:'RSS-Reader'" badging-archived.txt
            grep -F "targetSdkVersion:'34'" badging-archived.txt
            grep -F "versionName='${RELEASE_TAG#v}'" badging-archived.txt
            grep -F "versionCode='${ANDROID_VERSION_CODE}'" badging-archived.txt
          else
            test -f release-assets/RSS-Reader-android-arm64-v8a-debug.apk
            "$AAPT" dump badging release-assets/RSS-Reader-android-arm64-v8a-debug.apk > badging-archived.txt
            grep -F "application-label:'RSS-Reader'" badging-archived.txt
            grep -F "targetSdkVersion:'34'" badging-archived.txt
          fi

      - name: Upload Android artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: release-assets/*

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build Windows binaries
        run: |
          cargo build --release -p rssr-app
          cargo build --release -p rssr-cli

      - name: Archive Windows app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          New-Item -ItemType Directory -Force staging/RSS-Reader | Out-Null
          Copy-Item target/release/rssr-app.exe staging/RSS-Reader/RSS-Reader.exe
          Compress-Archive -Path staging/RSS-Reader/* -DestinationPath release-assets/RSS-Reader-windows-x86_64.zip
          Compress-Archive -Path target/release/rssr-cli.exe -DestinationPath release-assets/rssr-cli-windows-x86_64.zip

      - name: Smoke-check Windows artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force verify/app | Out-Null
          New-Item -ItemType Directory -Force verify/cli | Out-Null
          Expand-Archive -Path release-assets/RSS-Reader-windows-x86_64.zip -DestinationPath verify/app -Force
          Expand-Archive -Path release-assets/rssr-cli-windows-x86_64.zip -DestinationPath verify/cli -Force
          if (-not (Test-Path verify/app/RSS-Reader.exe)) { throw "missing RSS-Reader.exe in Windows app archive" }
          if (-not (Test-Path verify/cli/rssr-cli.exe)) { throw "missing rssr-cli.exe in Windows CLI archive" }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: release-assets/*

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Cleanup runner
        uses: ./.github/actions/cleanup-github-runner

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libxdo-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Setup Dioxus CLI
        uses: ./.github/actions/setup-dioxus-cli
        with:
          version: ${{ env.DIOXUS_CLI_VERSION }}

      - name: Stage crate-local icon paths for Linux bundler
        run: |
          rm -rf crates/rssr-app/icons
          mkdir -p crates/rssr-app/icons
          cp icons/icon.png crates/rssr-app/icons/icon.png
          cp icons/icon.ico crates/rssr-app/icons/icon.ico
          cp icons/icon.icns crates/rssr-app/icons/icon.icns

      - name: Build Linux app bundle and CLI
        run: |
          rm -rf target/linux-bundle
          dx bundle --platform desktop --package-types deb --package rssr-app --release --out-dir target/linux-bundle
          cargo build --release -p rssr-cli

      - name: Archive Linux artifacts
        run: |
          mkdir -p release-assets
          APP_DEB_PATH="$(find target/linux-bundle -maxdepth 1 -name '*.deb' | head -n1)"
          test -n "$APP_DEB_PATH"
          cp "$APP_DEB_PATH" release-assets/RSS-Reader-linux-x86_64.deb
          tar -C target/release -czf release-assets/rssr-cli-linux-x86_64.tar.gz rssr-cli

      - name: Smoke-check Linux artifacts
        run: |
          test -f release-assets/RSS-Reader-linux-x86_64.deb
          dpkg-deb -f release-assets/RSS-Reader-linux-x86_64.deb Package | grep '^rssr-app$\|^rss-reader$\|^io.github.develata.rssreader$'
          dpkg-deb -c release-assets/RSS-Reader-linux-x86_64.deb | grep 'usr/bin/rssr-app$\|usr/bin/RSS-Reader$\|usr/bin/rss-reader$'
          dpkg-deb -c release-assets/RSS-Reader-linux-x86_64.deb | grep 'usr/share/applications/.*\.desktop$'
          tar -tzf release-assets/rssr-cli-linux-x86_64.tar.gz | grep '^rssr-cli$'

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: release-assets/*

  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Cleanup runner
        uses: ./.github/actions/cleanup-github-runner

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Setup Dioxus CLI
        uses: ./.github/actions/setup-dioxus-cli
        with:
          version: ${{ env.DIOXUS_CLI_VERSION }}

      - name: Build web bundle
        run: dx bundle --platform web --package rssr-app --release --debug-symbols false --out-dir target/web-dist

      - name: Archive web bundle
        run: |
          mkdir -p release-assets
          tar -C target/web-dist -czf release-assets/RSS-Reader-web.tar.gz public

      - name: Smoke-check web artifact
        run: |
          tar -tzf release-assets/RSS-Reader-web.tar.gz | grep '^public/index.html$'
          tar -tzf release-assets/RSS-Reader-web.tar.gz | grep -E '^public/assets/rssr-app_bg-.*\.wasm$'

      - name: Upload web artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-web
          path: release-assets/*

  build-macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            suffix: macos-x86_64
          - target: aarch64-apple-darwin
            suffix: macos-aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Setup Dioxus CLI
        uses: ./.github/actions/setup-dioxus-cli
        with:
          version: ${{ env.DIOXUS_CLI_VERSION }}

      - name: Stage crate-local icon paths for macOS bundler
        run: |
          rm -rf crates/rssr-app/icons
          mkdir -p crates/rssr-app/icons
          cp icons/icon.png crates/rssr-app/icons/icon.png
          cp icons/icon.ico crates/rssr-app/icons/icon.ico
          cp icons/icon.icns crates/rssr-app/icons/icon.icns

      - name: Build macOS app bundle and CLI
        run: |
          rm -rf target/macos-bundle/${{ matrix.suffix }}
          dx bundle --platform desktop --package-types macos --package rssr-app --target ${{ matrix.target }} --release --out-dir target/macos-bundle/${{ matrix.suffix }}
          cargo build --release --target ${{ matrix.target }} -p rssr-cli

      - name: Archive macOS artifacts
        run: |
          mkdir -p release-assets
          APP_BUNDLE_PATH="$(find target/macos-bundle/${{ matrix.suffix }} -type d -name '*.app' | head -n1)"
          test -n "$APP_BUNDLE_PATH"
          mkdir -p target/macos-archive/${{ matrix.suffix }}
          rm -rf target/macos-archive/${{ matrix.suffix }}/RSS-Reader.app
          cp -R "$APP_BUNDLE_PATH" target/macos-archive/${{ matrix.suffix }}/RSS-Reader.app
          tar -C target/macos-archive/${{ matrix.suffix }} -czf release-assets/RSS-Reader-${{ matrix.suffix }}.tar.gz RSS-Reader.app
          tar -C target/${{ matrix.target }}/release -czf release-assets/rssr-cli-${{ matrix.suffix }}.tar.gz rssr-cli

      - name: Smoke-check macOS artifacts
        run: |
          tar -tzf release-assets/RSS-Reader-${{ matrix.suffix }}.tar.gz | grep '^RSS-Reader.app/Contents/Info.plist$'
          tar -tzf release-assets/rssr-cli-${{ matrix.suffix }}.tar.gz | grep '^rssr-cli$'

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.suffix }}
          path: release-assets/*

  publish-release:
    runs-on: ubuntu-latest
    needs:
      - build-android
      - build-windows
      - build-linux
      - build-macos
      - build-web
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          files: |
            release-assets/**/*.aab
            release-assets/**/*.apk
            release-assets/**/*.deb
            release-assets/**/*.zip
            release-assets/**/*.tar.gz
