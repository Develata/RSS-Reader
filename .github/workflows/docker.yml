name: Docker

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  publish-image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SMOKE_IMAGE: rss-reader-smoke:${{ github.sha }}
      SHOULD_PUSH_IMAGE: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cleanup runner
        uses: ./.github/actions/cleanup-github-runner
        with:
          prune-docker: "true"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: env.SHOULD_PUSH_IMAGE == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        if: env.SHOULD_PUSH_IMAGE == 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/develata/rss-reader
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha

      - name: Build smoke image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: ${{ env.SMOKE_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test container runtime
        run: |
          set -euo pipefail
          CONTAINER_NAME="rss-reader-smoke"
          trap 'docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true' EXIT

          ORIGIN="http://127.0.0.1:18080"
          # The container listens on 0.0.0.0, so it needs the public origin to start.
          docker run -d \
            --name "$CONTAINER_NAME" \
            -p 18080:8080 \
            -e RSS_READER_WEB_USERNAME=smoke \
            -e RSS_READER_WEB_PASSWORD=smoke-pass \
            -e RSS_READER_WEB_ENV=development \
            -e RSS_READER_WEB_PUBLIC_ORIGIN="$ORIGIN" \
            "$SMOKE_IMAGE"

          healthy=false
          for ((attempt = 1; attempt <= 20; attempt++)); do
            if curl --fail --silent --connect-timeout 2 --max-time 3 "$ORIGIN/healthz" >/dev/null; then
              healthy=true
              break
            fi
            sleep 2
          done
          if [[ "$healthy" != true ]]; then
            echo "container health check failed" >&2
            docker logs "$CONTAINER_NAME" || true
            exit 1
          fi

          # A login from the public origin creates a session in /data/auth.sqlite3.
          status="$(curl --silent --show-error --max-time 10 -o /dev/null -w '%{http_code}' \
            -c cookies.txt -X POST -H "Origin: $ORIGIN" \
            --data-urlencode username=smoke --data-urlencode password=smoke-pass \
            --data-urlencode next=/ "$ORIGIN/login")"
          if [[ "$status" != 303 ]] || ! curl --fail --silent --show-error --max-time 10 \
            -b cookies.txt "$ORIGIN/api/v1/session" | grep -q csrf_token; then
            echo "container login failed (status $status)" >&2
            docker logs "$CONTAINER_NAME" || true
            exit 1
          fi

      - name: Build and push image
        if: env.SHOULD_PUSH_IMAGE == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Skip image push on non-tag refs
        if: env.SHOULD_PUSH_IMAGE != 'true'
        run: |
          echo "Docker image push is disabled for ${GITHUB_REF}."
          echo "This workflow only publishes images for version tags (refs/tags/v*)."
