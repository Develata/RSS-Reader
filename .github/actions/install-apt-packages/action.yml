name: Install apt packages
description: Install Ubuntu packages, reusing the downloaded .deb files on the same runner image
inputs:
  packages:
    description: Space-separated package names
    required: true
  no-install-recommends:
    description: Pass --no-install-recommends to apt-get
    default: 'false'
runs:
  using: composite
  steps:
    # The cached files are exactly what this image lacked. Another image version may
    # already carry newer copies, so the key names the image as well as the request.
    # Without image identifiers (not a hosted runner) nothing is cached.
    - name: Key package downloads to the runner image
      id: key
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
        NO_RECOMMENDS: ${{ inputs.no-install-recommends }}
      run: |
        if [[ -n "${ImageOS:-}" && -n "${ImageVersion:-}" ]]; then
          read -r -a packages <<< "$PACKAGES"
          request="$(printf '%s\n' "${packages[@]}" | sort | tr '\n' ' ')no-install-recommends=$NO_RECOMMENDS"
          digest="$(printf '%s' "$request" | sha256sum | cut -c1-16)"
          echo "key=apt-$ImageOS-$ImageVersion-$RUNNER_ARCH-$digest" >> "$GITHUB_OUTPUT"
        fi
    - name: Restore package downloads
      id: cache
      if: steps.key.outputs.key != ''
      uses: actions/cache@v6
      with:
        path: ~/.cache/rssr-apt-debs
        key: ${{ steps.key.outputs.key }}
    - name: Install packages
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
        NO_RECOMMENDS: ${{ inputs.no-install-recommends }}
        CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        CACHEABLE: ${{ steps.key.outputs.key != '' }}
      run: |
        debs="$HOME/.cache/rssr-apt-debs"
        read -r -a packages <<< "$PACKAGES"
        installed() {
          local states
          states="$(dpkg-query -W -f='${db:Status-Status}\n' "${packages[@]}" 2>/dev/null || true)"
          [[ "$(grep -c '^installed$' <<< "$states")" -eq "${#packages[@]}" ]]
        }

        fix_options=()
        if [[ "$CACHE_HIT" == true ]]; then
          shopt -s nullglob
          files=("$debs"/*.deb)
          shopt -u nullglob
          # No files means the image already had every package.
          if { (( ${#files[@]} == 0 )) || sudo dpkg -i "${files[@]}"; } && installed; then
            echo "Installed ${#files[@]} cached package files without downloading"
            exit 0
          fi
          echo "::warning::Cached package files did not install; downloading again"
          fix_options=(--fix-broken)
        fi

        bash scripts/configure_ubuntu_apt.sh
        apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
        install_options=(-y "${fix_options[@]}")
        if [[ "$NO_RECOMMENDS" == true ]]; then install_options+=(--no-install-recommends); fi
        # Start from an empty archive so only this request's downloads are kept.
        sudo apt-get clean
        sudo apt-get "${apt_options[@]}" update
        sudo apt-get "${apt_options[@]}" install "${install_options[@]}" "${packages[@]}"
        installed
        if [[ "$CACHEABLE" == true ]]; then
          rm -rf "$debs"
          mkdir -p "$debs"
          find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp -t "$debs" {} +
          echo "Kept $(find "$debs" -name '*.deb' | wc -l) package files for this runner image"
        fi
